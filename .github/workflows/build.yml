name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Locate ffmpeg
        id: ffmpeg
        shell: python
        run: |
          import imageio_ffmpeg, os
          d = os.path.join(os.path.dirname(imageio_ffmpeg.__file__), 'binaries')
          files = [f for f in os.listdir(d) if f.startswith('ffmpeg-')]
          if files:
              ffmpeg_path = os.path.join(d, files[0])
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"ffmpeg={ffmpeg_path}\n")
          else:
              print("::warning title=ffmpeg not found::No ffmpeg binary found "
                    "in imageio_ffmpeg/binaries. Recording will be unavailable.")

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name ChangeSnap `
            --add-data "config.yaml;." `
            --add-binary "${{ steps.ffmpeg.outputs.ffmpeg }};imageio_ffmpeg/binaries" `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import mss `
            --hidden-import PIL `
            --hidden-import PIL.ImageGrab `
            --hidden-import docx `
            --hidden-import docx.opc `
            --hidden-import docx.oxml `
            --hidden-import openpyxl `
            --hidden-import yaml `
            --hidden-import pynput `
            --hidden-import pynput.keyboard `
            --hidden-import numpy `
            --hidden-import imageio `
            --hidden-import imageio_ffmpeg `
            --hidden-import json `
            --collect-all imageio `
            --collect-all imageio_ffmpeg `
            --copy-metadata imageio `
            --copy-metadata imageio_ffmpeg `
            --copy-metadata numpy `
            --copy-metadata Pillow `
            --copy-metadata mss `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --clean `
            --noconfirm `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChangeSnap-Windows
          path: dist/ChangeSnap.exe
