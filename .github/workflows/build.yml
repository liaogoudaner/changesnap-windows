name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download static ffmpeg
        run: |
          curl -L -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          7z x ffmpeg.zip -offmpeg_static
          move ffmpeg_static\ffmpeg-*\bin\ffmpeg.exe ffmpeg.exe
          echo "FFMPEG READY"

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed `
            --name ChangeSnap `
            --add-data "config.yaml;." `
            --add-binary "ffmpeg.exe;." `
            --hidden-import PySide6.QtWidgets `
            --hidden-import PySide6.QtCore `
            --hidden-import PySide6.QtGui `
            --hidden-import mss `
            --hidden-import PIL `
            --hidden-import PIL.ImageGrab `
            --hidden-import docx `
            --hidden-import docx.opc `
            --hidden-import docx.oxml `
            --hidden-import openpyxl `
            --hidden-import yaml `
            --hidden-import pynput `
            --hidden-import pynput.keyboard `
            --hidden-import numpy `
            --hidden-import imageio `
            --hidden-import imageio_ffmpeg `
            --hidden-import json `
            --collect-all imageio `
            --collect-all imageio_ffmpeg `
            --copy-metadata imageio `
            --copy-metadata imageio_ffmpeg `
            --copy-metadata numpy `
            --copy-metadata Pillow `
            --copy-metadata mss `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --clean `
            --noconfirm `
            app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ChangeSnap-Windows
          path: dist/ChangeSnap.exe
